# 统信 UOS 桌面专业版 V20（1070，codename Eagle，Debian 10 底座）
#
# V20 线内的 1010→1070 是点版本关系而非换代：1043 与 1070 相隔两年零四个月，
# 卷标同为 "UOS 20"、codename 同为 Eagle，装机清单里 libc6 都是 2.28.x、
# gcc 都是 8.3.0、dpkg 都是 1.19.7，只有厂商修订号在动。所以只做末版 1070。
#
# 盘内虽有 dists/eagle，但那是安装器的 overlay 仓库（Origin: isobuild，
# Packages 仅 123 KB），不足以 bootstrap；系统本体在 live/filesystem.squashfs。
DID=v20
DISPLAY_NAME="统信 UOS 桌面专业版 V20"
IMAGE=uos-v20
FAMILY=deb
METHOD=slice
ISO_URL="https://cdimage-download.chinauos.com/desktop-professional/1070/release/uos-desktop-20-professional-1070-${ARCH}.iso"
ISO_SQUASHFS_PATH="live/filesystem.squashfs"
# 每个架构一张盘，指纹各不相同。V20 只做 amd64 与 arm64。
# 这些值由 harvest 模式实测采回：缺锚点时构建必须失败，因为那等于不知道
# 手上这份是不是原货。
case "$ARCH" in
  amd64)    SQUASHFS_SHA256=6710cca36844d8047078d5fe6a8d42ad3df6c710211711ead1d50dfbc3ff5572 ;;
  arm64)    SQUASHFS_SHA256=9ebe3c493ccebb45d0d64e994dc4f60268bfccfeb8b73c689a3066c0d472b381 ;;
  *) SQUASHFS_SHA256="" ;;
esac
SRC_ROOTFS="$ROOT/work/v20-$ARCH-src"
USRMERGE=no
ADMINDIR="var/lib/dpkg"
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.25
EXPECT_GLIBCXX=3.4.25

SLICE_MICRO="libc6,libc-bin,libstdc++6,libgcc1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
# 没有 zstd：Debian 10 那一代的装机清单（1942 个包）里就没有它，而 UOS 没有
# 可用的 OS 软件源，装不上。V25 有。种子必须对着 live/filesystem.manifest
# （V25 是 live/filesystem.packages）逐个核，照抄另一版会在切片时才报「依赖未解析」。
SLICE_BASE_EXTRA="iproute2,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
# 与 V25 同样没有 g++：装机清单 1951 个包里没有它，devel 档只能做 C
SLICE_DEVEL_EXTRA="gcc,gcc-8,cpp-8,make,libc6-dev,binutils,dpkg-dev"
# 期望按事实声明，不靠 IMMUTABLE 之类的机制间接推断
EXPECT_CXX=no                      # 装机清单里没有 g++，源里也补不上（14 个常用工具源内可装性实测 0/14）
EXPECT_OS_REPO=no                  # 出厂有效源只有应用商店与打印驱动，装不了 OS 包
# 可复现锚点：切片路径没有 apt 源可推导时间戳，derive_epoch 取不到源会退回常量
# 1700000000（2023-11-14），那是个假锚点。这里钉 squashfs 超级块里的 mkfs 时间，
# 用 HTTP Range 读盘内 16 字节即可取到（magic hsqs + inodes + mkfs_time）。
# 每张盘各自压制，同版本不同架构也差几分钟，所以必须按架构写。
case "$ARCH" in
  amd64)    SOURCE_DATE_EPOCH=1714481065 ;;   # 2024-04-30 12:44 UTC
  arm64)    SOURCE_DATE_EPOCH=1714480761 ;;   # 2024-04-30 12:39 UTC
esac
EXPECT_SHADOW=0:42/640
