# 统信 UOS 桌面专业版 V25（2500u1，codename Snipe，OSTree 不可变）
#
# 与 V20 是真正的换代：codename Eagle→Snipe、卷标 "UOS 20"→"uos"、
# glibc 2.28→2.38，而且形态从传统 deb 变成 OSTree 不可变系统。
#
# 只有 beta 通道（release 通道实测不存在），发布物取自 beta，README 已注明。
DID=v25
DISPLAY_NAME="统信 UOS 桌面专业版 V25"
IMAGE=uos-v25
FAMILY=deb
METHOD=slice
ISO_URL="https://cdimage-download.chinauos.com/desktop-professional/2500u1/beta/uos-desktop-25-professional-2500-${ARCH}-202604.iso"
ISO_SQUASHFS_PATH="live/filesystem.squashfs"
# 每个架构一张盘，指纹各不相同。V25 另有新世界 loong64。
# 这些值由 harvest 模式实测采回：缺锚点时构建必须失败，因为那等于不知道
# 手上这份是不是原货。
case "$ARCH" in
  amd64)    SQUASHFS_SHA256=e1e2f90567a9cb1dd4e743d5b76f43f95d7895b3da154d4093b5a100dfe8a728 ;;
  arm64)    SQUASHFS_SHA256=7f3d1bb3623333ac9542ae48b9dfcdfd87c431f52cbd74568faa828cc5cc3546 ;;
  loong64)  SQUASHFS_SHA256=bdc639c737c509f22e90f1cbf3aeca7e373aa5ab30f775d9d722adb8cd781668 ;;
  *) SQUASHFS_SHA256="" ;;
esac
SRC_ROOTFS="$ROOT/work/v25-$ARCH-src"
USRMERGE=yes
ADMINDIR="usr/lib/dpkg/var"        # UOS V25 把 dpkg 数据库搬到 /usr 下（配合 OSTree /var 分离）
IMMUTABLE=yes                      # apt/dpkg 是 deepin-immutable-ctl 适配器，容器内必失败，切片时指回 .real
EXPECT_GLIBC=2.38
EXPECT_LIBSTDCPP=6.0.30
EXPECT_GLIBCXX=3.4.30

SLICE_MICRO="libc6,libc-bin,libstdc++6,libgcc-s1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
SLICE_BASE_EXTRA="iproute2,iputils-ping,vim-tiny,lsof,zstd,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
# ⚠️ UOS 的 ISO 里没有 g++ / libstdc++-dev，V20 与 V25 都没有，而且源里也补不上
#    （在线源只有应用商店的 GUI 应用）。devel 档因此只能做 C，不能做 C++。
SLICE_DEVEL_EXTRA="gcc,gcc-12,cpp-12,make,libc6-dev,binutils,dpkg-dev"
# 期望按事实声明，不靠 IMMUTABLE 之类的机制间接推断
EXPECT_CXX=no                      # 装机清单里没有 g++，源里也补不上（14 个常用工具源内可装性实测 0/14）
EXPECT_OS_REPO=no                  # 出厂有效源只有应用商店与打印驱动，装不了 OS 包
EXPECT_SHADOW=0:42/640
